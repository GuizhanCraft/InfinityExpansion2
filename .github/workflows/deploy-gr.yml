name: Deploy to Guizhan Resources

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew clean shadowJar

      - name: Get Version
        id: version
        run: |
          # Find the built jar
          JAR_PATH=$(ls build/libs/InfinityExpansion2-*.jar | head -n 1)
          FILENAME=$(basename "$JAR_PATH")

          # Extract version from filename
          # Filename format: InfinityExpansion2-<version>.jar
          VERSION=${FILENAME#InfinityExpansion2-}
          VERSION=${VERSION%.jar}

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "Found jar: $JAR_PATH"
          echo "Version: $VERSION"

      - name: Upload to Guizhan Resources
        uses: ybw0014/guizhan-resources-action@v0
        with:
          domain: ${{ vars.GUIZHAN_RESOURCES_BASE_URL }}
          token: ${{ secrets.GUIZHAN_RESOURCES_TOKEN }}
          project: ${{ vars.GUIZHAN_RESOURCES_PROJECT_ID }}
          channel: preview
          version: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          changelog: Automated build from GitHub Actions
          files: build/libs/InfinityExpansion2-*.jar
